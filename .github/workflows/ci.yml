name: Terraform CI

on:
  push:
    branches:
      - master
      - featurebranch

  pull_request:
    branches:
      - master

permissions:
  id-token: write
  contents: read

jobs:
  terraform-ci:

    runs-on: ubuntu-latest

    steps:

      # 1. Checkout Repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Azure Login using OIDC
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: "6656127f-84b1-4863-8607-48501595f57a"
          tenant-id: "4b9cff3a-07ab-4d9d-945d-df704d1808d4"
          subscription-id: "32befec2-21d4-498b-a715-32aa460c0a9d"

      # 3. Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 4. Terraform Version
      - name: Terraform Version
        run: terraform version

      # 5. Security Scan
      - name: Terraform Security Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH

      # 6. Terraform Init
      - name: Terraform Init
        run: terraform init

      # 7. Terraform Format Check
      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      # 8. Terraform Validate
      - name: Terraform Validate
        run: terraform validate

      # 9. Terraform Plan
      - name: Terraform Plan
        run: terraform plan -out=tfplan

      # 10. Upload Terraform Plan
      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: tfplan